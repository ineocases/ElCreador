<!-- admin.html -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Admin - El Viral</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<h1>⚙️ Panel Admin</h1>
<div id="admin-gate">
  <h3>➕ Agregar Evento</h3>
  <input id="ev-titulo" placeholder="Título">
  <input id="ev-texto" placeholder="Descripción">
  <select id="ev-tipo">
    <option value="golpe">Golpe duro</option>
    <option value="decision">Decisión</option>
    <option value="colab">Colab</option>
  </select>
  <input id="ev-op1" placeholder="Opción 1">
  <input id="ev-op2" placeholder="Opción 2">
  <button class="btn" onclick="addEvent()">Guardar evento</button>
  <h3>📋 Eventos existentes</h3>
  <div id="ev-list"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/admin.js"></script>
</body></html>
