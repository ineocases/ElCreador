<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Viral 📱</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- INICIO -->
<div id="screen-start" class="screen">
  <div class="logo">EL VIRAL</div>
  <p class="tagline">El modo carrera del creador de contenido argentino</p>
  <div class="start-card">
    <input id="in-name" placeholder="Tu nombre de creador">
    <select id="in-niche"></select>
    <select id="in-origin">
      <option value="CABA">CABA</option><option value="Conurbano">Conurbano</option>
      <option value="Córdoba">Córdoba</option><option value="Rosario">Rosario</option>
    </select>
    <button class="btn btn-primary big" onclick="startNewCareer()">🚀 EMPEZAR CARRERA</button>
  </div>
</div>

<!-- JUEGO -->
<div id="screen-game" class="screen hidden">
  <div class="hud-top">
    <span id="season-label" class="season"></span>
    <button class="icon-btn" onclick="tryOpenAdmin()">⚙️</button>
  </div>

  <!-- LA FIGURITA -->
  <div class="figurita nivel-0" id="fig-card">
    <div class="fig-inner">
      <div class="fig-row">
        <span id="fig-media" class="fig-media">55</span>
        <span id="fig-level" class="fig-badge">DESCONOCIDO</span>
      </div>
      <div id="fig-avatar" class="fig-avatar">🎙️</div>
      <div id="fig-name" class="fig-name">TU NOMBRE</div>
      <div id="fig-niche" class="fig-niche">⚽ Fútbol</div>
      <div id="fig-stats" class="fig-stats"></div>
    </div>
  </div>

  <!-- CONTADORES -->
  <div class="counters">
    <div class="counter main"><span class="counter-num" id="count-followers">0</span><span class="counter-label">Seguidores</span></div>
    <div class="counter"><span class="counter-num small" id="count-money">$0</span><span class="counter-label">Plata</span></div>
  </div>

  <span class="heat-label">🔥 Calor</span>
  <div class="bar"><div id="heat-fill" class="bar-fill heat-fill"></div></div>

  <span class="heat-label">📅 Trimestre</span>
  <div class="bar"><div id="block-progress" class="bar-fill gold-fill"></div></div>

  <button class="btn btn-primary big" id="btn-play" onclick="playBlock()" style="margin-top:18px">▶ JUGAR TRIMESTRE</button>
  <button class="btn btn-ghost" id="btn-paren" onclick="startParenLaMano()" style="display:none">🤸 IR A PAREN LA MANO</button>
  <button class="btn btn-ghost" id="btn-velada" onclick="startVelada()" style="display:none">🥊 LA VELADA</button>

  <h3>🛒 Tienda</h3><div id="shop" class="shop"></div>
  <h3>📜 Historial</h3><div id="log" class="log"></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen hidden">
  <h2 style="color:var(--gold)">⚙️ Panel Admin</h2>
  <input id="ev-titulo" placeholder="Título del evento">
  <input id="ev-texto" placeholder="Descripción">
  <select id="ev-tipo"><option value="golpe">Golpe duro</option><option value="decision">Decisión</option><option value="colab">Colab</option></select>
  <input id="ev-op1" placeholder="Opción 1"><input id="ev-op2" placeholder="Opción 2">
  <button class="btn btn-primary" onclick="addEvent()">Guardar evento</button>
  <button class="btn btn-ghost" onclick="closeAdmin()">← Volver</button>
  <h3>📋 Eventos guardados</h3><div id="ev-list" class="log"></div>
</div>

<!-- MODAL EVENTO -->
<div id="event-modal" class="modal"><div class="modal-box">
  <h3 id="ev-title"></h3><p id="ev-text"></p><div id="ev-options"></div>
</div></div>

<!-- MODAL MINIJUEGO -->
<div id="minigame-modal" class="modal"><div class="modal-box">
  <h3>🎯 ¡Clavalo en la zona verde!</h3>
  <div class="mg-track"><div id="mg-zone" class="mg-zone"></div><div id="mg-bar-fill" class="mg-fill"></div></div>
  <button class="btn btn-primary big" id="mg-btn">¡AHORA!</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
