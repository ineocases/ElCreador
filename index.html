<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Viral 📱</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--accent:#ff3b5c;--text:#f2f2f2}
*{box-sizing:border-box;margin:0;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);padding:20px;max-width:480px;margin:0 auto}
h1{color:var(--accent);text-align:center}h3{margin:14px 0 6px}
.hidden{display:none!important}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:var(--card);color:var(--text)}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 16px;border-radius:10px;cursor:pointer;margin:6px 0;width:100%;font-size:16px}
.btn.big{font-size:18px;font-weight:bold}.btn.small{width:auto;font-size:13px;margin:4px}
.btn.ghost{background:#2a2d35}
.stats{display:flex;gap:12px;justify-content:space-between;background:var(--card);padding:12px;border-radius:10px;margin:10px 0}
.bar{background:#2a2d35;border-radius:8px;height:14px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,#ff9d00,#ff3b5c);height:100%;width:0%;transition:width .3s}
.bar-label{font-size:12px;margin-top:8px;color:#aaa}
.log{background:var(--card);border-radius:10px;padding:10px;font-size:13px;max-height:200px;overflow-y:auto}
.log div{padding:4px 0;border-bottom:1px solid #262a31}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.modal-box{background:var(--card);padding:24px;border-radius:16px;width:90%;max-width:400px}
.mg-track{position:relative;height:30px;background:#2a2d35;border-radius:8px;margin:16px 0;overflow:hidden}
.mg-zone{position:absolute;height:100%;background:rgba(0,200,100,.4)}
.mg-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.icon-btn{background:none;border:none;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <span>EL VIRAL 📱</span>
  <button class="icon-btn" onclick="tryOpenAdmin()">⚙️</button>
</div>

<!-- INICIO -->
<div id="screen-start" class="screen">
  <h1>EL VIRAL</h1>
  <p style="text-align:center;color:#aaa">El modo carrera del creador de contenido argentino</p>
  <input id="in-name" placeholder="Tu nombre de creador">
  <select id="in-niche"></select>
  <select id="in-origin">
    <option value="CABA">CABA</option><option value="Conurbano">Conurbano</option>
    <option value="Córdoba">Córdoba</option><option value="Rosario">Rosario</option>
  </select>
  <button class="btn" onclick="startNewCareer()">🚀 Empezar carrera</button>
</div>

<!-- JUEGO -->
<div id="screen-game" class="screen hidden">
  <h2 id="ui-name"></h2>
  <p><span id="ui-niche"></span> · <span id="ui-week"></span></p>
  <div class="stats">
    <div>👥 <span id="ui-followers"></span></div>
    <div>💰 <span id="ui-money"></span></div>
    <div id="ui-level"></div>
  </div>
  <p id="ui-attr" style="font-size:12px;color:#aaa"></p>
  <div class="bar-label">🔥 Calor</div>
  <div class="bar"><div id="ui-heat" class="bar-fill"></div></div>
  <button class="btn big" onclick="doWeek()">📹 Crear contenido</button>
  <button class="btn ghost" id="btn-paren" onclick="startParenLaMano()" style="display:none">🤸 Ir a Paren la Mano</button>
  <button class="btn ghost" id="btn-velada" onclick="startVelada()" style="display:none">🥊 La Velada</button>
  <h3>🛒 Tienda</h3><div id="shop"></div>
  <h3>📜 Historial</h3><div id="ui-log" class="log"></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen hidden">
  <h2>⚙️ Panel Admin</h2>
  <h3>➕ Agregar evento</h3>
  <input id="ev-titulo" placeholder="Título del evento">
  <input id="ev-texto" placeholder="Descripción">
  <select id="ev-tipo"><option value="golpe">Golpe duro</option><option value="decision">Decisión</option><option value="colab">Colab</option></select>
  <input id="ev-op1" placeholder="Opción 1">
  <input id="ev-op2" placeholder="Opción 2">
  <button class="btn" onclick="addEvent()">Guardar evento</button>
  <button class="btn ghost" onclick="closeAdmin()">← Volver al juego</button>
  <h3>📋 Eventos guardados</h3><div id="ev-list" class="log"></div>
</div>

<!-- MODAL EVENTO -->
<div id="event-modal" class="modal"><div class="modal-box">
  <h3 id="ev-title"></h3><p id="ev-text"></p><div id="ev-options"></div>
</div></div>

<!-- MODAL MINIJUEGO -->
<div id="minigame-modal" class="modal"><div class="modal-box">
  <h3>🎯 ¡Clavalo en la zona verde!</h3>
  <div class="mg-track"><div id="mg-zone" class="mg-zone"></div><div id="mg-bar-fill" class="mg-fill"></div></div>
  <button class="btn big" id="mg-btn">¡AHORA!</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ============ FIREBASE: PEGÁ TU CONFIG ACÁ ============
firebase.initializeApp({
  apiKey:"AIzaSyBPmDeyflAieOkWMo5M4omBRSb8D7dqW90", authDomain:"elviral.firebaseapp.com",
  projectId:"elviral", appId:"1:363741155240:web:e545179e101608cc1c179d"
});
const db = firebase.firestore(), auth = firebase.auth();
let UID = null;
auth.signInAnonymously().then(c=>{UID=c.user.uid}).catch(e=>console.error(e));

// ============ DATOS ============
const NICHES={futbol:{nombre:"⚽ Fútbol",mult:1.2},gaming:{nombre:"🎮 Gaming",mult:1.0},reacts:{nombre:"🍿 Reacts",mult:1.3},humor:{nombre:"😂 Humor",mult:1.1},cocina:{nombre:"🍳 Cocina",mult:.9},gym:{nombre:"🏋️ Gym",mult:1.0}};
const LEVELS=[{min:0,n:"Desconocido",e:"▫️"},{min:1e3,n:"Subs",e:"👥"},{min:1e4,n:"Referente",e:"💙"},{min:1e5,n:"Ídolo",e:"⭐"},{min:1e6,n:"Leyenda",e:"🗿"}];
const STARTER_EVENTS=[
 {titulo:"Corte de luz en pleno directo",texto:"Se fue la luz justo en el mejor momento del stream.",opciones:[{label:"Seguir con datos del celu",efectos:{heat:5,seguidores:200}},{label:"Levantar y pedir disculpas",efectos:{heat:-2,seguidores:-100}}]},
 {titulo:"Canje dudoso",texto:"Una marca de cripto te ofrece mucha plata pero no parecen serios.",opciones:[{label:"Aceptar la guita 💸",efectos:{plata:5000,heat:25}},{label:"Rechazar",efectos:{heat:-5}}]},
 {titulo:"Te invita un streamer grande",texto:"Te llegó un MD para ir a su stream.",opciones:[{label:"Aceptar colab",efectos:{seguidores:1500}},{label:"Rechazar",efectos:{seguidores:100,heat:2}}]},
 {titulo:"Polémica en Twitter",texto:"Un tweet viejo tuyo se hizo viral y te critican.",opciones:[{label:"Disculpas en blanco y negro",efectos:{heat:-15,seguidores:-200}},{label:"Hacer un chiste",efectos:{heat:10,seguidores:800}}]}
];
const SHOP=[
 {id:"micro",nombre:"🎙️ Micrófono",costo:800,tipo:"setup",ef:"edicion",bonus:3},
 {id:"camara",nombre:"📷 Cámara",costo:1200,tipo:"setup",ef:"edicion",bonus:3},
 {id:"silla",nombre:"🪑 Silla Gamer",costo:600,tipo:"setup",ef:"aguante",bonus:3},
 {id:"pc",nombre:"🖥️ PC RTX",costo:3000,tipo:"setup",ef:"edicion",bonus:5},
 {id:"editor",nombre:"✂️ Editor",costo:1500,tipo:"staff",ef:"carisma",bonus:2},
 {id:"psico",nombre:"🧠 Psicólogo",costo:1000,tipo:"staff",ef:"aguante",bonus:2}
];

let state=null,currentEvent=null,mgInterval=null;

// ============ CARRERA ============
function newCareer(name,niche,origin){state={uid:UID,name,niche,origin,week:1,year:1,followers:0,money:500,heat:0,level:0,attributes:{carisma:10,edicion:10,olfato:10,aguante:10,oratoria:10},staff:[],setup:[],stats:{videos:0,virals:0,awards:0},veladaUnlocked:false,parenDone:false,parenInvite:false,log:[]}}

function doWeek(){
 if(!state)return;state.week++;if(state.week%52===0){state.year++;if(state.followers>1e4){state.stats.awards++;addLog("🏆 ¡Nominado a los Coscu Army Awards!")}}
 const a=state.attributes,attr=a.carisma*.8+a.edicion*1.2+a.olfato+a.oratoria*.5;
 const setupB=1+state.setup.length*.15;
 let views=Math.floor(80*(1+attr/50)*setupB*NICHES[state.niche].mult*(0.6+Math.random()*.8));
 state.money+=Math.floor(views*.01);state.stats.videos++;
 if(Math.random()<(a.olfato+a.edicion)/300){views*=8;state.stats.virals++;addLog(`🔥 ¡SE VIRALIZÓ! ${formatNum(views)} vistas`)}
 state.followers+=Math.floor(views*.08);state.heat=Math.max(0,state.heat-1);
 if(Math.random()<.35)triggerRandomEvent();
 updateLevel();if(state.heat>=100){state.heat=50;state.followers=Math.floor(state.followers*.7);addLog("💀 TE FUNARON. -30% comunidad")}
 render();saveGame();
}

// ============ EVENTOS ============
async function getEvents(){try{const s=await db.collection("events").get();if(s.empty)return STARTER_EVENTS;return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return STARTER_EVENTS}}
async function triggerRandomEvent(){const evs=await getEvents();const v=evs.filter(e=>!e.nichos||e.nichos.includes("*")||e.nichos.includes(state.niche));if(!v.length)return;showEvent(v[Math.floor(Math.random()*v.length)])}
function showEvent(ev){currentEvent=ev;document.getElementById("ev-title").textContent=ev.titulo;document.getElementById("ev-text").textContent=ev.texto;const box=document.getElementById("ev-options");box.innerHTML="";ev.opciones.forEach((op,i)=>{const b=document.createElement("button");b.className="btn";b.textContent=op.label;b.onclick=()=>chooseOption(i);box.appendChild(b)});document.getElementById("event-modal").classList.add("show")}
function chooseOption(i){applyEffects(currentEvent.opciones[i].efectos);addLog(`📌 ${currentEvent.titulo}`);document.getElementById("event-modal").classList.remove("show");render();saveGame()}
function applyEffects(ef){if(!ef)return;if(ef.plata)state.money=Math.max(0,state.money+ef.plata);if(ef.seguidores)state.followers=Math.max(0,state.followers+ef.seguidores);if(ef.heat)state.heat=clamp(state.heat+ef.heat,0,100)}

// ============ NIVELES / TIENDA ============
function updateLevel(){let l=0;for(let i=0;i<LEVELS.length;i++)if(state.followers>=LEVELS[i].min)l=i;state.level=l;if(l>=2&&!state.parenDone&&!state.veladaUnlocked)state.parenInvite=true}
function buyItem(id){const it=SHOP.find(s=>s.id===id);if(!it||state.money<it.costo)return;const list=it.tipo==="setup"?state.setup:state.staff;if(list.includes(id))return;state.money-=it.costo;list.push(id);if(state.attributes[it.ef]!==undefined)state.attributes[it.ef]+=it.bonus;addLog(`🛒 Compraste ${it.nombre}`);render();saveGame()}

// ============ MINIJUEGO TIMING ============
function startTiming(cb){const m=document.getElementById("minigame-modal");m.classList.add("show");const fill=document.getElementById("mg-bar-fill"),zone=document.getElementById("mg-zone");let pos=0,dir=1;const zs=40+Math.random()*10,zw=18;zone.style.left=zs+"%";zone.style.width=zw+"%";mgInterval=setInterval(()=>{pos+=dir*2.2;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}fill.style.width=pos+"%"},16);document.getElementById("mg-btn").onclick=()=>{clearInterval(mgInterval);const hit=pos>=zs&&pos<=zs+zw;m.classList.remove("show");cb(hit)}}
function startParenLaMano(){startTiming(ok=>{if(ok){state.parenDone=true;state.veladaUnlocked=true;state.parenInvite=false;addLog("🤸 ¡Superaste Paren la Mano!")}else{state.heat+=10;addLog("🤸 Te caíste en Paren la Mano...")}render();saveGame()})}
function startVelada(){if(!state.veladaUnlocked)return;startTiming(win=>{if(win){state.followers+=5e4;addLog("🥊 ¡GANASTE LA VELADA! +50K")}else{state.followers+=1e4;addLog("🥊 Perdiste, pero +10K por el morbo")}state.veladaUnlocked=false;state.parenDone=false;state.parenInvite=false;render();saveGame()})}

// ============ GUARDADO ============
async function saveGame(){if(!UID||!state)return;try{const cid=state.careerId||db.collection("careers").doc().id;state.careerId=cid;await db.collection("careers").doc(cid).set(state,{merge:true})}catch(e){console.error(e)}}

// ============ ADMIN ============
async function tryOpenAdmin(){auth.onAuthStateChanged(async u=>{if(!u)return;const d=await db.collection("users").doc(u.uid).get();if(d.exists&&d.data().admin){show("screen-admin");loadAdminEvents()}else alert("❌ No sos admin. En Firestore ponete admin:true en users/"+u.uid)})}
function closeAdmin(){show(state&&!state.gameOver?"screen-game":"screen-start")}
async function addEvent(){await db.collection("events").add({titulo:document.getElementById("ev-titulo").value,texto:document.getElementById("ev-texto").value,tipo:document.getElementById("ev-tipo").value,nichos:["*"],opciones:[{label:document.getElementById("ev-op1").value,efectos:{heat:5}},{label:document.getElementById("ev-op2").value,efectos:{heat:-5}}]});alert("✅ Guardado");loadAdminEvents()}
async function loadAdminEvents(){const s=await db.collection("events").get();document.getElementById("ev-list").innerHTML=s.docs.map(d=>`<div>📌 ${d.data().titulo}</div>`).join("")||"Sin eventos todavía."}

// ============ UI ============
function show(id){["screen-start","screen-game","screen-admin"].forEach(s=>document.getElementById(s).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function startNewCareer(){const name=document.getElementById("in-name").value.trim()||"Streamer",niche=document.getElementById("in-niche").value,origin=document.getElementById("in-origin").value;const t=()=>{if(UID){newCareer(name,niche,origin);show("screen-game");renderShop();render();saveGame()}else setTimeout(t,300)};t()}
function renderShop(){const box=document.getElementById("shop");box.innerHTML="";SHOP.forEach(it=>{const b=document.createElement("button");b.className="btn small";b.textContent=`${it.nombre} $${it.costo}`;b.onclick=()=>buyItem(it.id);box.appendChild(b)})}
function render(){if(!state)return;const lv=LEVELS[state.level];setText("ui-name",state.name);setText("ui-niche",NICHES[state.niche].nombre);setText("ui-week",`Semana ${state.week} · Año ${state.year}`);setText("ui-followers",formatNum(state.followers));setText("ui-money","$"+formatNum(state.money));setText("ui-level",`${lv.e} ${lv.n}`);setBar("ui-heat",state.heat);const a=state.attributes;setText("ui-attr",`Carisma ${a.carisma} · Edición ${a.edicion} · Olfato ${a.olfato} · Aguante ${a.aguante} · Oratoria ${a.oratoria}`);document.getElementById("ui-log").innerHTML=state.log.map(l=>`<div>${l}</div>`).join("");document.getElementById("btn-paren").style.display=state.parenInvite&&!state.parenDone?"block":"none";document.getElementById("btn-velada").style.display=state.veladaUnlocked?"block":"none"}
function setText(id,v){const el=document.getElementById(id);if(el)el.textContent=v}
function setBar(id,v){const el=document.getElementById(id);if(el)el.style.width=v+"%"}
function addLog(m){state.log.unshift(`S${state.week} ${m}`);state.log=state.log.slice(0,30)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function formatNum(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n)}

window.onload=()=>{const sel=document.getElementById("in-niche");Object.entries(NICHES).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v.nombre;sel.appendChild(o)})};
</script>
</body>
</html>
